<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Red Templar Cross -->
  <defs>
    <linearGradient id="crossGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D84949;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A01E1E;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Cross shape -->
  <g id="cross">
    <!-- Vertical bar -->
    <rect x="70" y="20" width="60" height="140" fill="url(#crossGradient)"/>
    <!-- Horizontal bar -->
    <rect x="35" y="65" width="130" height="60" fill="url(#crossGradient)"/>

    <!-- Cross flares/decorations -->
    <path d="M 70 20 L 60 10 L 100 10 L 130 20" fill="url(#crossGradient)"/>
    <path d="M 130 20 L 140 10 L 140 50 L 130 65" fill="url(#crossGradient)"/>
  </g>

  <!-- Text: LA CATEDRAL -->
  <text x="100" y="190" font-family="'Cinzel', 'Georgia', serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a1a" letter-spacing="1">LA</text>
  <text x="100" y="220" font-family="'Cinzel', 'Georgia', serif" font-size="20" font-weight="700" text-anchor="middle" fill="#1a1a1a" letter-spacing="2">CATEDRAL</text>
</svg>
