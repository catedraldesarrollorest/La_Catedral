<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D84949;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B1A1A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Templar Cross -->
  <g id="templar-cross">
    <!-- Vertical bar -->
    <rect x="65" y="20" width="70" height="160" fill="url(#crossGrad)" rx="8"/>
    <!-- Horizontal bar -->
    <rect x="30" y="65" width="140" height="70" fill="url(#crossGrad)" rx="8"/>

    <!-- Decorative flares at ends -->
    <!-- Top flare -->
    <path d="M 80 20 Q 70 10 100 10 Q 130 10 120 20" fill="url(#crossGrad)"/>
    <!-- Right flare -->
    <path d="M 170 80 Q 180 70 180 100 Q 180 130 170 120" fill="url(#crossGrad)"/>
    <!-- Bottom flare -->
    <path d="M 120 180 Q 130 190 100 190 Q 70 190 80 180" fill="url(#crossGrad)"/>
    <!-- Left flare -->
    <path d="M 30 120 Q 20 130 20 100 Q 20 70 30 80" fill="url(#crossGrad)"/>
  </g>
</svg>
